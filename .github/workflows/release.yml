name: Knowledge Card Cabinet Release

on:
  push:
    tags:
      - "v*.*.*"
  # A dry run. Everything happens except the publish, so the pipeline can be
  # proved without a tag and without a release — which matters because two of
  # the last three releases failed in ways only a tag push would have shown:
  # once on a test that needed a directory CI does not have, once on an
  # installer 337 MB heavier than the same build made by hand.
  workflow_dispatch:

jobs:
  package:
    name: Desktop package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon only. The Intel runner queued for the better part of an
        # hour while the other two were long finished, and it builds for a Mac
        # Apple stopped selling — an Intel user can still build from source.
        include:
          - name: windows-x64
            os: windows-latest
            build_args: --win --x64
          - name: macos-arm64
            os: macos-14
            build_args: --mac --arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm test
      - run: npm run verify:runtime
      - run: npm run desktop:dist -- ${{ matrix.build_args }}
      # Needs desktop/node_modules, which only exists once desktop:dist has run
      # its prepare step — so it goes here, between packaging and uploading,
      # rather than in `npm test`.
      - run: npm run check:packaging
      # Only the finished packages. electron-builder also leaves the unpacked
      # app beside them — 600 MB and thousands of files per runner — which
      # would be uploaded, downloaded again, and then handed to the release as
      # a directory it cannot attach.
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: List what would be published
        run: ls -l release
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
