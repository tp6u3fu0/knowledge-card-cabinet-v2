name: Knowledge Card Cabinet Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  package:
    name: Desktop package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            build_args: --win --x64
          - name: macos-x64
            os: macos-13
            build_args: --mac --x64
          - name: macos-arm64
            os: macos-14
            build_args: --mac --arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm test
      - run: npm run verify:runtime
      - run: npm run desktop:dist -- ${{ matrix.build_args }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
