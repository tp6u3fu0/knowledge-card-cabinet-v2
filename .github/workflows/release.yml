name: Knowledge Card Cabinet Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm test
      - run: npm run verify:runtime
      - run: npm run desktop:dist
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
