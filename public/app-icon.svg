<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- The app icon is the product's own card mark: a knowledge card with the
       three-node trace that stands for the relations between cards. Colours are
       the app's ink and accents so the icon and the interface read as one thing.
       Drawn to survive 16px: the trace is heavy and the nodes are large. -->
  <rect width="512" height="512" rx="112" fill="#211f27"/>
  <rect x="118" y="86" width="276" height="340" rx="46" fill="#faf8f4"/>
  <rect x="118" y="86" width="276" height="340" rx="46" stroke="#3a3742" stroke-width="6"/>
  <path d="M186 322 L256 192 L326 292" stroke="#c96f5f" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="186" cy="322" r="38" fill="#c96f5f"/>
  <circle cx="256" cy="192" r="38" fill="#4d9b8e"/>
  <circle cx="326" cy="292" r="38" fill="#4e91a8"/>
</svg>
