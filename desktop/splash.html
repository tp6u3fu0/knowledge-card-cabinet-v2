<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>知識卡冊</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", "Noto Sans TC", sans-serif; background: #f3f0e9; color: #292633; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 20% 20%, #fffaf0 0, transparent 38%), #f3f0e9; }
      main { width: min(520px, calc(100vw - 48px)); padding: 42px; border: 1px solid rgba(41, 38, 51, .14); border-radius: 24px; background: rgba(255, 252, 246, .82); box-shadow: 0 22px 60px rgba(41, 38, 51, .1); }
      .mark { width: 52px; height: 52px; display: grid; place-items: center; border: 1px solid #292633; border-radius: 50%; font-size: 24px; }
      .eyebrow { margin: 26px 0 8px; color: #766f70; font-size: 11px; font-weight: 700; letter-spacing: .22em; }
      h1 { margin: 0; font-family: Georgia, "Noto Serif TC", serif; font-size: 40px; font-weight: 400; letter-spacing: -.08em; }
      #status { margin: 28px 0 8px; font-size: 16px; font-weight: 700; }
      #detail { min-height: 44px; margin: 0; color: #766f70; font-size: 13px; line-height: 1.7; }
      .actions { display: flex; gap: 10px; margin-top: 24px; }
      button { border: 0; border-radius: 999px; padding: 11px 18px; background: #292633; color: #fffaf0; cursor: pointer; font: inherit; }
      button.secondary { background: transparent; color: #292633; border: 1px solid rgba(41, 38, 51, .2); }
      button[hidden] { display: none; }
      .pulse { display: inline-block; width: 9px; height: 9px; margin-right: 8px; border-radius: 50%; background: #4d9b8e; box-shadow: 0 0 0 5px rgba(77, 155, 142, .12); }
      .error .pulse { background: #c96f5f; box-shadow: 0 0 0 5px rgba(201, 111, 95, .12); }
    </style>
  </head>
  <body>
    <main id="panel">
      <div class="mark">◎</div>
      <p class="eyebrow">KNOWLEDGE CARD CABINET</p>
      <h1>知識卡冊</h1>
      <p id="status"><span class="pulse"></span>正在準備</p>
      <p id="detail">正在啟動本機服務，請稍候。</p>
      <div class="actions">
        <button id="retry" hidden>重新啟動</button>
        <button class="secondary" id="docs">查看 API 狀態</button>
      </div>
    </main>
    <script>
      const panel = document.querySelector("#panel");
      const status = document.querySelector("#status");
      const detail = document.querySelector("#detail");
      const retry = document.querySelector("#retry");
      const docs = document.querySelector("#docs");

      function update(payload) {
        const labels = {
          checking: "檢查本機環境",
          starting: "啟動服務中",
          waiting: "等待服務就緒",
          ready: "準備完成",
          error: "無法啟動知識卡冊",
        };
        status.innerHTML = `<span class="pulse"></span>${labels[payload.status] || "正在準備"}`;
        detail.textContent = payload.detail || "";
        retry.hidden = payload.status !== "error";
        panel.classList.toggle("error", payload.status === "error");
      }

      window.desktopStatus.onChange(update);
      retry.addEventListener("click", () => {
        retry.hidden = true;
        update({ status: "checking", detail: "正在重新啟動…" });
        window.desktopStatus.retry();
      });
      docs.addEventListener("click", () => window.desktopStatus.openDocs());
    </script>
  </body>
</html>
