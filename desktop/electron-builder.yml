appId: com.knowledgecard.cabinet
productName: 知識卡冊
directories:
  app: desktop
  output: release
files:
  - "**/*"
afterPack: desktop/after-pack.cjs
asar: true
asarUnpack:
  - "node_modules/@huggingface/transformers/**"
  - "node_modules/@huggingface/jinja/**"
  - "node_modules/@img/**"
  - "node_modules/onnxruntime-node/**"
  - "node_modules/onnxruntime-common/**"
  - "node_modules/sharp/**"
extraResources:
  - from: dist
    to: kcc-web/dist
  - from: public
    to: kcc-web/public
  - from: backend/seed.json
    to: kcc-data/seed.json
win:
  target:
    - nsis
  artifactName: "KnowledgeCardCabinet-${version}-Setup.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: ${env.GITHUB_REPOSITORY_OWNER}
  repo: ${env.GITHUB_REPOSITORY_NAME}
