appId: com.knowledgecard.cabinet
productName: 知識卡冊
directories:
  app: desktop
  output: release
files:
  - "**/*"
afterPack: desktop/after-pack.cjs
asar: true
asarUnpack:
  - "node_modules/@huggingface/transformers/**"
  - "node_modules/@huggingface/jinja/**"
  - "node_modules/@img/**"
  - "node_modules/onnxruntime-node/**"
  - "node_modules/onnxruntime-common/**"
  - "node_modules/sharp/**"
extraResources:
  - from: dist
    to: kcc-web/dist
  - from: public
    to: kcc-web/public
  - from: backend/seed.json
    to: kcc-data/seed.json
win:
  target:
    - nsis
  artifactName: "KnowledgeCardCabinet-${version}-Setup.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 知識卡冊
# No `publish` block on purpose. The release workflow uploads release/* with
# softprops/action-gh-release, so electron-builder never needs to publish — and
# a publish block referencing ${env.GITHUB_REPOSITORY_OWNER} made every local
# build fail at the final step, which is the build anyone actually runs by hand.
